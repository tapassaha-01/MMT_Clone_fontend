<app-customerbar></app-customerbar>
<div class="main-container">
    <div>
        <h3>From {{departure}} to {{destination}}</h3>
        <h6>Details for flights on {{journeyDate | date: 'shortDate'}}</h6>
    </div>
    <table>
        <tbody>
            <tr *ngFor="let item of flightDetails">
                <th>{{item.travelCompanyName}}</th>
                <th>{{item.departureDate}}</th>
                <th>{{item.totalTime}} hours journey</th>
                <th>{{item.arrivalDate}}</th>
                <th>{{item.price}}</th>
                <th><button class="book-btn" (click)="onBookFlight(item)">Book</button></th>
            </tr>
        </tbody>
    </table>
</div>
